version: 2

models:
  - name: dim_customers
    description: "Customer dimension"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: "Product dimension with price tier"
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: "Order fact, incremental merge on order_id"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id

  - name: mart_daily_sales
    description: "Daily orders, units and revenue"
    columns:
      - name: order_date
        data_tests: [unique, not_null]

  - name: mart_customer_summary
    description: "Lifetime metrics per customer"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: mart_product_performance
    description: "Sales and cancellation metrics per product"
    columns:
      - name: product_id
        data_tests: [unique, not_null]
