name: 'lake_pipeline'
version: '1.0.0'
config-version: 2

profile: 'default'          # dbt Cloud ignores this; the connection comes from the Cloud environment

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

models:
  lake_pipeline:
    +file_format: parquet
    staging:
      +materialized: table
      +schema: staging             # -> Glue database "staging"
    marts:
      +materialized: table
      +schema: marts               # -> Glue database "marts"
